services:
  sql-lab:
    image: postgres:16
    environment:
      POSTGRES_DB: querypilot_lab
      POSTGRES_USER: lab_admin
      POSTGRES_PASSWORD: ${SQL_LAB_ADMIN_PASSWORD:?Set SQL_LAB_ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - querypilot_lab_data:/var/lib/postgresql/data
      - ./services/sql-lab/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_admin -d querypilot_lab"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  querypilot_lab_data:
